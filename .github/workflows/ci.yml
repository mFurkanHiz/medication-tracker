name: CI

on:
  # A merge to main deploys, so a commit that changes nothing the server runs should
  # not restart it. Docs-only merges are skipped here and nowhere else: pull requests
  # below have no paths filter, so a documentation change is still built and tested
  # before it lands — this only declines to ship it. GitHub skips a push only when
  # every changed file matches, so a commit touching docs *and* code deploys as usual,
  # and a docs commit can still be deployed on demand with Run workflow.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:

  # Deploying the commit that is already on main should not need an empty commit to
  # push. A manual run rebuilds and re-verifies from scratch, so it ships exactly what
  # a merge would have shipped.
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: >-
          Run deploy/smoke-test.ps1 against the live site after deploying. It registers
          one synthetic household, so it is off by default and worth turning on for a
          release whose behaviour changed.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      MEDICATION_TRACKER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=medication_tracker_test;Username=medication_tracker;Password=medication_tracker_ci_only
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: medication_tracker_test
          POSTGRES_USER: medication_tracker
          POSTGRES_PASSWORD: medication_tracker_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medication_tracker -d medication_tracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MedicationTracker.slnx
      - run: dotnet test MedicationTracker.slnx --no-restore --configuration Release

  clients:
    name: Web and mobile checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: medication_tracker_migration_blank
          POSTGRES_USER: medication_tracker
          POSTGRES_PASSWORD: medication_tracker_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medication_tracker -d medication_tracker_migration_blank"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # A squash merge computes its diff against the merge base, not against main. So
      # when a branch renames a file that main gained from an earlier squash of the same
      # branch, the rename arrives as an addition and the old file is never deleted —
      # leaving a workflow behind that still points at a script that moved. That is how
      # cleanup-smoke-accounts.yml survived its own rename. Cheap to check, invisible
      # otherwise.
      - name: Every script a workflow names must exist
        run: |
          set -euo pipefail
          missing=0
          for path in $(grep -hoE 'deploy/[A-Za-z0-9._-]+\.(sh|sql)' .github/workflows/*.yml | sort -u); do
            if [ -f "$path" ]; then
              echo "ok      $path"
            else
              echo "MISSING $path — referenced by a workflow but not in the tree" >&2
              missing=1
            fi
          done
          test "$missing" = 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:web
      - run: pnpm typecheck:mobile
      - run: pnpm test:mobile

      # The on-device schema gets one chance to upgrade correctly on somebody's phone,
      # and the developer's own device is always the clean install that hides the bug.
      - run: pnpm check:mobile-migration
      - run: pnpm build:web
      - run: docker compose -f compose.web.yml config
      - run: docker build --file apps/web/Dockerfile --tag medication-tracker-web:ci --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
      - run: docker build --file apps/api/Dockerfile --tag medication-tracker-api:ci --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
      - name: Test packaged migration SQL on isolated PostgreSQL
        env:
          ConnectionStrings__Database: Host=localhost;Database=design_only;Username=design_only
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore apps/api
          # The upgrade test must start from the schema production actually runs, which
          # is every migration before the package-first rebuild, not an earlier
          # intermediate. Otherwise the rebuild's renames and value transforms are
          # exercised against tables that did not yet exist.
          dotnet ef migrations script 0 20260916103329_ScheduledWeekdaysAndIntervals --project apps/api --output migration-baseline.sql
          container=$(docker create medication-tracker-api:ci)
          docker cp "$container:/app/migrations.sql" image-migrations.sql
          docker rm "$container"
          sha256sum image-migrations.sql
          test "$(docker image inspect medication-tracker-api:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect medication-tracker-web:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          pg() {
            docker run --rm --network host -e PGPASSWORD=medication_tracker_ci_only -i postgres:18.4-alpine \
              psql -h 127.0.0.1 -U medication_tracker -v ON_ERROR_STOP=1 -d "$1"
          }
          pg medication_tracker_migration_blank < image-migrations.sql
          pg medication_tracker_migration_blank < image-migrations.sql
          printf '%s\n' 'CREATE DATABASE medication_tracker_migration_upgrade;' | pg postgres
          pg medication_tracker_migration_upgrade < migration-baseline.sql
          pg medication_tracker_migration_upgrade < tests/migrations/baseline-seed.sql
          pg medication_tracker_migration_upgrade < image-migrations.sql
          pg medication_tracker_migration_upgrade < image-migrations.sql
          pg medication_tracker_migration_upgrade < tests/migrations/verify-upgrade.sql
          # The live database runs TEN migrations, not eleven: the schedule migration was
          # never deployed. So the real upgrade path applies both it and the rebuild in
          # one pass. Exercise that exact path against production-shaped data, including
          # the zero-quantity acquisition rows production actually holds.
          printf '%s\n' 'CREATE DATABASE medication_tracker_production_shape;' | pg postgres
          dotnet ef migrations script 0 20260916101828_PackageLendingAndReturns --project apps/api --output migration-production-baseline.sql
          pg medication_tracker_production_shape < migration-production-baseline.sql
          pg medication_tracker_production_shape < tests/migrations/production-shape-seed.sql
          pg medication_tracker_production_shape < image-migrations.sql
          pg medication_tracker_production_shape < image-migrations.sql
          pg medication_tracker_production_shape < tests/migrations/verify-production-shape.sql
      # A releasable main build: a merge, or a manual run asking for the same thing.
      # This condition, the upload below and the deploy job's own must stay in step —
      # a run that builds no artifact leaves the deploy with nothing to download.
      - name: Package VPS web image
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        run: docker save medication-tracker-web:ci medication-tracker-api:ci | gzip -9 > medication-tracker-web.tar.gz
      - name: Upload VPS web image
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: medication-tracker-web-${{ github.sha }}
          path: medication-tracker-web.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  # DEPLOY_ENABLED is the owner's arming switch, and it has to be read in a job of its
  # own. A job-level `if:` cannot see the `secrets` context at all, so a switch stored
  # as a secret would read as empty there and deployment would never run — with no
  # error to explain why. A step can see both contexts, so this job reads either and
  # publishes a plain yes/no the deploy job can gate on.
  #
  # The answer is deliberately "yes"/"no" rather than the switch's own value: if the
  # switch lives in a secret, GitHub masks its value everywhere in the logs, and an
  # output of "true" would print as "***".
  gate:
    name: Check whether deployment is armed
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.check.outputs.armed }}
    steps:
      - name: Read the arming switch
        id: check
        env:
          FROM_VARIABLE: ${{ vars.DEPLOY_ENABLED }}
          FROM_SECRET: ${{ secrets.DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          # A variable wins over a secret, so the readable one is authoritative when
          # both exist. Neither being set means deployment was never configured.
          switch="${FROM_VARIABLE:-${FROM_SECRET:-}}"
          if [ "$switch" = "true" ]; then
            echo 'armed=yes' >> "$GITHUB_OUTPUT"
            echo 'Deployment is armed.'
          else
            echo 'armed=no' >> "$GITHUB_OUTPUT"
            echo 'DEPLOY_ENABLED is not set to true, so the deploy job will be skipped.'
            echo 'Set it as a repository variable (readable) or a secret (masked) under'
            echo 'Settings -> Secrets and variables -> Actions.'
          fi

  deploy:
    name: Deploy to the VPS
    needs: [api, clients, gate]

    # Both test jobs passed, this is a releasable main build rather than a pull
    # request, and the gate job above found the arming switch set to "true". Until it
    # is, the job is skipped rather than failing, so a merge is never red for a
    # deployment nobody configured.
    if: needs.gate.outputs.armed == 'yes'
    runs-on: ubuntu-latest

    # One deploy at a time, and never cancelled half-way: two overlapping runs would
    # race on the same compose project, and a cancellation between the schema step and
    # the restart would leave the site down.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    # Declaring the environment lets the owner require a reviewer before any deploy
    # runs, which is how the acceptance contract's preflight gate survives automation.
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: medication-tracker-web-${{ github.sha }}

      - name: Authorise the SSH session
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Secret VPS_SSH_KEY is not set.' >&2; exit 1; }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Takes the host key from the secret, or from deploy/known_hosts in this
          # commit, and fails with the server's current key for review if neither
          # holds one. It never trusts the network: see the script's own comment.
          bash deploy/authorise-ssh.sh ~/.ssh/known_hosts

      - name: Transfer the release, verifying it survived the wire
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST is not set, as a variable or a secret.' >&2; exit 1; }
          target="${VPS_USER:-root}@${VPS_HOST}"

          # The host key comes from a secret and is never accepted on trust: an
          # unknown key aborts rather than prompting.
          ssh_opts=(-i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
                    -o BatchMode=yes -o ConnectTimeout=20)

          ssh "${ssh_opts[@]}" "$target" \
            'install -d -m 700 /opt/medication-tracker/.deploy && install -d -m 755 /opt/medication-tracker/deploy'

          # The script and the compose file travel with the image, from this exact
          # commit, so the deploy can never run an older script against a newer image
          # and nothing depends on the state of a checkout on the host. They land on
          # the same paths the manual runbook uses, so there is only ever one script.
          scp "${ssh_opts[@]}" \
            medication-tracker-web.tar.gz \
            "$target:/opt/medication-tracker/.deploy/medication-tracker-web.tar.gz"
          scp "${ssh_opts[@]}" \
            deploy/deploy-production.sh \
            "$target:/opt/medication-tracker/deploy/deploy-production.sh"
          scp "${ssh_opts[@]}" \
            compose.production.yml \
            "$target:/opt/medication-tracker/compose.production.yml"

          local_sum="$(sha256sum medication-tracker-web.tar.gz | cut -d' ' -f1)"
          remote_sum="$(ssh "${ssh_opts[@]}" "$target" \
            'sha256sum /opt/medication-tracker/.deploy/medication-tracker-web.tar.gz' | cut -d' ' -f1)"

          echo "local  $local_sum"
          echo "remote $remote_sum"
          test "$local_sum" = "$remote_sum" || {
            echo 'The archive changed in transit. Nothing was deployed.' >&2
            exit 1
          }

      - name: Run the deployment
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
        run: |
          set -euo pipefail
          target="${VPS_USER:-root}@${VPS_HOST}"
          ssh_opts=(-i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
                    -o BatchMode=yes -o ConnectTimeout=20)

          # The script takes the backup, verifies it is readable, stops only this
          # project's api and web containers, applies the packaged migrations, brings
          # them back and then proves no other project's containers went down with it.
          ssh "${ssh_opts[@]}" "$target" 'bash /opt/medication-tracker/deploy/deploy-production.sh'

      # The deploy script proves the site answers on the host's own loopback port. This
      # proves it answers through nginx and the public name, which is the only part a
      # reader of this log cannot otherwise check. It writes nothing.
      - name: Prove the public site answers
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || secrets.PUBLIC_URL || 'https://medicationtracker.rapidconfigs.com' }}
        run: |
          set -euo pipefail

          landing="$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/")"
          echo "GET / -> $landing"
          test "$landing" = "200" || { echo 'The site did not serve.' >&2; exit 1; }

          # 401 is the right answer for an anonymous session read: anything else means
          # the request never reached the API, or reached it and was let through.
          session="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/api/auth/session")"
          echo "GET /api/auth/session -> $session"
          test "$session" = "401" || {
            echo "Expected 401 from the API through nginx, got $session." >&2
            exit 1
          }

      - name: Run the public smoke test
        if: inputs.run_smoke_test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || secrets.PUBLIC_URL || 'https://medicationtracker.rapidconfigs.com' }}
        shell: pwsh
        run: ./deploy/smoke-test.ps1 -BaseUrl $env:PUBLIC_URL

      - name: Forget the key
        if: always()
        run: shred --remove --force ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
