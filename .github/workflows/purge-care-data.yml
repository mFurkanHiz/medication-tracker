name: Purge care data

# This erases every care record in production, so it never runs on its own. It needs
# an explicit confirmation, and it lives in its own file so no change to the test
# pipeline can start it by accident.
#
# There are two ways to confirm, and both are deliberate acts that name the thing
# being erased:
#
#   1. Dispatch it and type ERASE-CARE-DATA into the form.
#   2. Commit deploy/purge-care-data.request to main containing that same line.
#
# The second exists because an agent session's token cannot dispatch a workflow —
# GitHub answers 403 — and the owner asked not to be the one clicking. A commit on
# main is if anything a stronger record than a form field: it is reviewed, attributed,
# timestamped and kept. The push trigger is narrowed to that one path, so no ordinary
# commit can reach this workflow, and the request file is removed again afterwards.
# Removing it changes that path too, so this then runs once more and finds nothing to
# do, which it reports and passes.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type ERASE-CARE-DATA to confirm. This erases every person, medication,
          package, plan, dose and count in production. Accounts and households survive,
          so signing in still works. A verified backup is taken first, and it is the
          only way back.
        required: true
        type: string

  push:
    branches: [main]
    paths:
      - 'deploy/purge-care-data.request'

permissions:
  contents: read

jobs:
  purge:
    name: Purge the superseded care data
    runs-on: ubuntu-latest

    # Never two at once, and never cancelled part-way through. Shared with the deploy:
    # a purge and a release must not race on the same compose project.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    environment: production

    steps:
      - uses: actions/checkout@v7

      # Reads the confirmation from whichever route asked, and refuses anything else.
      # This touches no network and holds no credential, so it runs before the key is
      # ever written to disk.
      - name: Resolve the confirmation
        id: gate
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          request=deploy/purge-care-data.request

          if [ -n "${CONFIRM:-}" ]; then
            test "$CONFIRM" = "ERASE-CARE-DATA" || {
              echo 'Refusing: the confirmation must be exactly ERASE-CARE-DATA.' >&2
              exit 1
            }
            echo 'Confirmed by the dispatch input.'
            echo 'proceed=yes' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "$request" ]; then
            echo "No $request in this commit, so nothing is being asked for."
            echo 'This is what the run looks like after a request file is removed'
            echo 'again, which is the last step of a purge rather than a failure.'
            echo 'proceed=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          grep -qx 'ERASE-CARE-DATA' "$request" || {
            echo "Refusing: $request exists but holds no line that reads exactly" >&2
            echo 'ERASE-CARE-DATA. A file that does not say what it authorises' >&2
            echo 'authorises nothing.' >&2
            exit 1
          }

          echo "Confirmed by $request in this commit:"
          sed 's/^/    /' "$request"
          echo 'proceed=yes' >> "$GITHUB_OUTPUT"

      - name: Authorise the SSH session
        if: steps.gate.outputs.proceed == 'yes'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Secret VPS_SSH_KEY is not set.' >&2; exit 1; }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Same host-key handling as the deploy, from the same script: the secret,
          # else deploy/known_hosts from this commit, else stop before the network.
          bash deploy/authorise-ssh.sh ~/.ssh/known_hosts

      - name: Purge, behind a verified backup
        if: steps.gate.outputs.proceed == 'yes'
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST is not set, as a variable or a secret.' >&2; exit 1; }
          target="${VPS_USER:-root}@${VPS_HOST}"
          ssh_opts=(-i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
                    -o BatchMode=yes -o ConnectTimeout=20)

          # Ship the script and its SQL from this commit, so what runs is what was
          # reviewed rather than whatever happens to be on the host.
          ssh "${ssh_opts[@]}" "$target" 'install -d -m 755 /opt/medication-tracker/deploy'
          scp "${ssh_opts[@]}" \
            deploy/purge-care-data.sh deploy/purge-care-data.sql \
            "$target:/opt/medication-tracker/deploy/"

          ssh "${ssh_opts[@]}" "$target" \
            'bash /opt/medication-tracker/deploy/purge-care-data.sh --yes-erase-care-data'

      - name: Prove the site still answers
        if: steps.gate.outputs.proceed == 'yes'
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || secrets.PUBLIC_URL || 'https://medicationtracker.rapidconfigs.com' }}
        run: |
          set -euo pipefail
          landing="$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/")"
          session="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/api/auth/session")"
          echo "GET / -> $landing"
          echo "GET /api/auth/session -> $session"
          test "$landing" = "200" || { echo 'The site did not serve.' >&2; exit 1; }
          test "$session" = "401" || { echo "Expected 401, got $session." >&2; exit 1; }

      - name: Forget the key
        if: always()
        run: shred --remove --force ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
