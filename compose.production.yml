services:
  web:
    image: medication-tracker-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3022:80"
    mem_limit: 96m
    depends_on:
      - api
  api:
    image: medication-tracker-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75
    environment:
      # The API's own credential. APP_DATABASE_USER / APP_DATABASE_PASSWORD are written
      # into .env.production on the host by deploy/apply-least-privilege.sh (acceptance
      # row 37); until they exist the API falls back to the bootstrap account, so a
      # deploy that lands before that script has run changes nothing.
      ConnectionStrings__Database: "Host=database;Database=medication_tracker;Username=${APP_DATABASE_USER:-medication_tracker};Password=${APP_DATABASE_PASSWORD:-${DATABASE_PASSWORD:?required}};Maximum Pool Size=20"
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimit: "0x10000000"
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      POSTGRES_DB: medication_tracker
      POSTGRES_USER: medication_tracker
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medication_tracker -d medication_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  database:
