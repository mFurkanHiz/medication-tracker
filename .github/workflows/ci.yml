name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      MEDICATION_TRACKER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=medication_tracker_test;Username=medication_tracker;Password=medication_tracker_ci_only
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: medication_tracker_test
          POSTGRES_USER: medication_tracker
          POSTGRES_PASSWORD: medication_tracker_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medication_tracker -d medication_tracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MedicationTracker.slnx
      - run: dotnet test MedicationTracker.slnx --no-restore --configuration Release

  clients:
    name: Web and mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck:mobile
      - run: pnpm build:web
      - run: docker compose -f compose.web.yml config
      - run: docker build --file apps/web/Dockerfile --tag medication-tracker-web:ci .
      - name: Package VPS web image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save medication-tracker-web:ci | gzip -9 > medication-tracker-web.tar.gz
      - name: Upload VPS web image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: medication-tracker-web-${{ github.sha }}
          path: medication-tracker-web.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
