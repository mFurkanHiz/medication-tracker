name: Account cleanup

# Removes accounts from production. Which ones is chosen by the confirmation, and each
# SQL file says at its top exactly what it matches and what it protects:
#
#   REMOVE-SYNTHETIC-ACCOUNTS  every account at a .invalid address — the domain RFC
#                              2606 reserves so that it can never belong to a person.
#                              That is where the automated checks register.
#   KEEP-ONLY-OWNER-ACCOUNT    a one-off: everything except the owner's own account,
#                              identified by the digest of their address so that no
#                              personal address enters this public repository.
#   REPORT-ACCOUNTS            read-only. Describes the accounts with their addresses
#                              masked, for when it is not yet clear which to remove.
#
# Separate from the care-data purge, because a destructive operation should name
# exactly what it erases. Confirmation works by either route:
#
#   1. Dispatch it and type the confirmation into the form.
#   2. Commit deploy/account-cleanup.request to main containing that same line.
#
# The second exists because an agent session's token cannot dispatch a workflow
# (GitHub answers 403). The push trigger is narrowed to that one path, so no ordinary
# commit can reach this workflow, and removing the file again runs it once more to find
# nothing to do.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          REMOVE-SYNTHETIC-ACCOUNTS removes every account at a .invalid address.
          KEEP-ONLY-OWNER-ACCOUNT removes every account except the owner's.
          REPORT-ACCOUNTS changes nothing and only describes what is there. The two
          deletions also remove households left with no remaining member, and both take
          a verified backup first.
        required: true
        type: string

  push:
    branches: [main]
    paths:
      - 'deploy/account-cleanup.request'

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove the accounts named by the confirmation
    runs-on: ubuntu-latest

    # Shared with the deploy and the purge: these must never run against the same
    # compose project at the same time.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the confirmation
        id: gate
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          request=deploy/account-cleanup.request

          # Each confirmation names one reviewed SQL file. Nothing else can be run.
          sql_for() {
            case "$1" in
              REMOVE-SYNTHETIC-ACCOUNTS) echo deploy/cleanup-synthetic-accounts.sql ;;
              KEEP-ONLY-OWNER-ACCOUNT) echo deploy/keep-only-owner-account.sql ;;
              REPORT-ACCOUNTS)         echo deploy/account-report.sql ;;
              *)                       echo '' ;;
            esac
          }

          if [ -n "${CONFIRM:-}" ]; then
            sql="$(sql_for "$CONFIRM")"
            test -n "$sql" || {
              echo 'Refusing: the confirmation must be exactly one of' >&2
              echo 'REMOVE-SYNTHETIC-ACCOUNTS, KEEP-ONLY-OWNER-ACCOUNT, REPORT-ACCOUNTS.' >&2
              exit 1
            }
            echo "Confirmed by the dispatch input: $sql"
            echo 'proceed=yes' >> "$GITHUB_OUTPUT"
            echo "sql=$sql" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "$request" ]; then
            echo "No $request in this commit, so nothing is being asked for."
            echo 'This is what the run looks like after a request file is removed'
            echo 'again, which is the last step rather than a failure.'
            echo 'proceed=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sql=''
          for confirmation in REMOVE-SYNTHETIC-ACCOUNTS KEEP-ONLY-OWNER-ACCOUNT REPORT-ACCOUNTS; do
            if grep -qx "$confirmation" "$request"; then
              test -z "$sql" || {
                echo "Refusing: $request names more than one confirmation. One run," >&2
                echo 'one deletion, so that the log says plainly what happened.' >&2
                exit 1
              }
              sql="$(sql_for "$confirmation")"
            fi
          done

          test -n "$sql" || {
            echo "Refusing: $request exists but holds no line that reads exactly" >&2
            echo 'REMOVE-SYNTHETIC-ACCOUNTS, KEEP-ONLY-OWNER-ACCOUNT or REPORT-ACCOUNTS.' >&2
            echo 'A file that does not say what it authorises authorises nothing.' >&2
            exit 1
          }

          echo "Confirmed by $request in this commit, running $sql:"
          sed 's/^/    /' "$request"
          echo 'proceed=yes' >> "$GITHUB_OUTPUT"
          echo "sql=$sql" >> "$GITHUB_OUTPUT"

      - name: Authorise the SSH session
        if: steps.gate.outputs.proceed == 'yes'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Secret VPS_SSH_KEY is not set.' >&2; exit 1; }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash deploy/authorise-ssh.sh ~/.ssh/known_hosts

      - name: Remove them, behind a verified backup
        if: steps.gate.outputs.proceed == 'yes'
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          SQL: ${{ steps.gate.outputs.sql }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST is not set, as a variable or a secret.' >&2; exit 1; }
          target="${VPS_USER:-root}@${VPS_HOST}"
          ssh_opts=(-i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
                    -o BatchMode=yes -o ConnectTimeout=20)

          # Ship the script and its SQL from this commit, so what runs is what was
          # reviewed rather than whatever happens to be on the host.
          ssh "${ssh_opts[@]}" "$target" 'install -d -m 755 /opt/medication-tracker/deploy'
          scp "${ssh_opts[@]}" \
            deploy/cleanup-accounts.sh "$SQL" \
            "$target:/opt/medication-tracker/deploy/"

          ssh "${ssh_opts[@]}" "$target" \
            "cd /opt/medication-tracker && bash deploy/cleanup-accounts.sh --yes-remove-accounts '$SQL'"

      - name: Prove the site still answers
        if: steps.gate.outputs.proceed == 'yes'
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || secrets.PUBLIC_URL || 'https://medicationtracker.rapidconfigs.com' }}
        run: |
          set -euo pipefail
          landing="$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/")"
          session="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/api/auth/session")"
          echo "GET / -> $landing"
          echo "GET /api/auth/session -> $session"
          test "$landing" = "200" || { echo 'The site did not serve.' >&2; exit 1; }
          test "$session" = "401" || { echo "Expected 401, got $session." >&2; exit 1; }

      - name: Forget the key
        if: always()
        run: shred --remove --force ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
