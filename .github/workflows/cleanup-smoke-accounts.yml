name: Clean up smoke-test accounts

# Removes the accounts deploy/smoke-test.ps1 registers — synthetic-smoke-<guid>@
# example.invalid — and the households left with no other member. A real address cannot
# match: RFC 2606 reserves .invalid so that it can never be routed to anyone.
#
# It is its own workflow rather than a mode of the care-data purge, because a
# destructive operation should name exactly what it erases. Confirmation works the same
# way, by either route:
#
#   1. Dispatch it and type REMOVE-SMOKE-ACCOUNTS into the form.
#   2. Commit deploy/cleanup-smoke-accounts.request to main containing that same line.
#
# The second exists because an agent session's token cannot dispatch a workflow
# (GitHub answers 403). The push trigger is narrowed to that one path, so no ordinary
# commit can reach this workflow, and removing the file again runs it once more to find
# nothing to do.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type REMOVE-SMOKE-ACCOUNTS to confirm. This removes the synthetic accounts the
          smoke test leaves behind, and the households whose only members are those
          accounts. A verified backup is taken first.
        required: true
        type: string

  push:
    branches: [main]
    paths:
      - 'deploy/cleanup-smoke-accounts.request'

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove the smoke-test accounts
    runs-on: ubuntu-latest

    # Shared with the deploy and the purge: these must never run against the same
    # compose project at the same time.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the confirmation
        id: gate
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          request=deploy/cleanup-smoke-accounts.request

          if [ -n "${CONFIRM:-}" ]; then
            test "$CONFIRM" = "REMOVE-SMOKE-ACCOUNTS" || {
              echo 'Refusing: the confirmation must be exactly REMOVE-SMOKE-ACCOUNTS.' >&2
              exit 1
            }
            echo 'Confirmed by the dispatch input.'
            echo 'proceed=yes' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "$request" ]; then
            echo "No $request in this commit, so nothing is being asked for."
            echo 'This is what the run looks like after a request file is removed'
            echo 'again, which is the last step rather than a failure.'
            echo 'proceed=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          grep -qx 'REMOVE-SMOKE-ACCOUNTS' "$request" || {
            echo "Refusing: $request exists but holds no line that reads exactly" >&2
            echo 'REMOVE-SMOKE-ACCOUNTS. A file that does not say what it authorises' >&2
            echo 'authorises nothing.' >&2
            exit 1
          }

          echo "Confirmed by $request in this commit:"
          sed 's/^/    /' "$request"
          echo 'proceed=yes' >> "$GITHUB_OUTPUT"

      - name: Authorise the SSH session
        if: steps.gate.outputs.proceed == 'yes'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'Secret VPS_SSH_KEY is not set.' >&2; exit 1; }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash deploy/authorise-ssh.sh ~/.ssh/known_hosts

      - name: Remove them, behind a verified backup
        if: steps.gate.outputs.proceed == 'yes'
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'VPS_HOST is not set, as a variable or a secret.' >&2; exit 1; }
          target="${VPS_USER:-root}@${VPS_HOST}"
          ssh_opts=(-i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
                    -o BatchMode=yes -o ConnectTimeout=20)

          # Ship the script and its SQL from this commit, so what runs is what was
          # reviewed rather than whatever happens to be on the host.
          ssh "${ssh_opts[@]}" "$target" 'install -d -m 755 /opt/medication-tracker/deploy'
          scp "${ssh_opts[@]}" \
            deploy/cleanup-smoke-accounts.sh deploy/cleanup-smoke-accounts.sql \
            "$target:/opt/medication-tracker/deploy/"

          ssh "${ssh_opts[@]}" "$target" \
            'bash /opt/medication-tracker/deploy/cleanup-smoke-accounts.sh --yes-remove-smoke-accounts'

      - name: Prove the site still answers
        if: steps.gate.outputs.proceed == 'yes'
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || secrets.PUBLIC_URL || 'https://medicationtracker.rapidconfigs.com' }}
        run: |
          set -euo pipefail
          landing="$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/")"
          session="$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/api/auth/session")"
          echo "GET / -> $landing"
          echo "GET /api/auth/session -> $session"
          test "$landing" = "200" || { echo 'The site did not serve.' >&2; exit 1; }
          test "$session" = "401" || { echo "Expected 401, got $session." >&2; exit 1; }

      - name: Forget the key
        if: always()
        run: shred --remove --force ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
